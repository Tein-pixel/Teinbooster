name: TeinBooster - Build and Release APK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag release, contoh v1.0.0"
        required: true
        default: "v1.0.0"
        type: string

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android cmdline-tools and SDK packages
        shell: bash
        run: |
          set -euo pipefail

          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -la "$ANDROID_HOME" || true
          find "$ANDROID_HOME" -maxdepth 4 -type f -name sdkmanager -print || true

          export ANDROID_SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"

          if [ ! -x "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            echo "sdkmanager tidak ditemukan pada path yang diharapkan, mencoba download commandlinetools..."
            cd /tmp
            curl -fSL "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -o cmdline-tools.zip
            rm -rf "$ANDROID_SDK_ROOT/cmdline-tools/latest"
            mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools/latest"
            unzip -q cmdline-tools.zip -d "$ANDROID_SDK_ROOT/cmdline-tools"
            if [ -d "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools/bin" ]; then
              cp -r "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools/." "$ANDROID_SDK_ROOT/cmdline-tools/latest/"
            fi
            rm -rf cmdline-tools.zip "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools"
          fi

          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            echo "::error::sdkmanager tidak ditemukan di $ANDROID_SDK_ROOT/cmdline-tools/latest/bin"
            exit 1
          fi

          export PATH="$(dirname "$SDKMANAGER"):$PATH"

          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Extract project
        shell: bash
        run: |
          set -euo pipefail

          test -f TeinBooster.zip || {
            echo "::error::TeinBooster.zip tidak ditemukan di root repository"
            exit 1
          }

          mkdir -p "$RUNNER_TEMP/source"
          unzip -q TeinBooster.zip -d "$RUNNER_TEMP/source"

          WRAPPER="$(find "$RUNNER_TEMP/source" -type f -name gradlew -print -quit)"
          test -n "$WRAPPER" || {
            echo "::error::File gradlew tidak ditemukan di zip"
            exit 1
          }

          DIR="$(dirname "$WRAPPER)"

          if [ -f "$DIR/settings.gradle" ] || [ -f "$DIR/settings.gradle.kts" ]; then
            :
          else
            echo "::error::settings.gradle / settings.gradle.kts tidak ditemukan"
            exit 1
          fi

          if [ ! -f "$DIR/gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "::error::Gradle wrapper JAR tidak ditemukan"
            exit 1
          fi

          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"
          chmod +x "$WRAPPER"

      - name: Build installable release APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          ./gradlew --no-daemon --stacktrace assembleRelease

          APK="$(find app/build/outputs/apk -type f -name '*.apk' | grep -E 'release' | head -n 1 || true)"
          if [ -z "$APK" ]; then
            echo "::error::APK release tidak ditemukan"
            find app/build/outputs/apk -type f -name '*.apk' || true
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/final-apk"
          cp "$APK" "$RUNNER_TEMP/final-apk/TeinBooster.apk"

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort | tail -n 1 || true)"
          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner tidak ditemukan"
            exit 1
          fi

          "$APKSIGNER" verify --verbose "$RUNNER_TEMP/final-apk/TeinBooster.apk"

      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: TeinBooster ${{ inputs.tag }}
          target_commitish: ${{ github.sha }}
          body: |
            TeinBooster Android APK.
            Unduh TeinBooster.apk untuk instalasi.
          files: ${{ runner.temp }}/final-apk/TeinBooster.apk
          fail_on_unmatched_files: true
          make_latest: true
