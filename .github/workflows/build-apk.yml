name: Build TeinBooster APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'TeinBooster.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="$(find . -maxdepth 1 -type f -iname 'TeinBooster.zip' -print -quit)"
          if [ -z "$ZIP_FILE" ]; then
            echo 'ERROR: TeinBooster.zip tidak ditemukan di root repository.'
            echo 'Upload file ZIP dengan nama TeinBooster.zip ke root repository.'
            exit 1
          fi
          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted
          PROJECT_DIR="$(find extracted -type f -name settings.gradle -printf '%h\n' | head -n 1)"
          if [ -z "$PROJECT_DIR" ]; then
            echo 'ERROR: settings.gradle tidak ditemukan di dalam ZIP.'
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project directory: $PROJECT_DIR"

      - name: Build debug and release APKs
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug assembleRelease

      - name: Upload APK files
        uses: actions/upload-artifact@v4
        with:
          name: TeinBooster-APKs
          path: |
            extracted/**/app/build/outputs/apk/debug/*.apk
            extracted/**/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
